[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gateco"
version = "0.1.0"
description = "Official Python SDK for the Gateco API"
authors = [{name = "Rami Refaeli", email = "rami@gateco.ai"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.26",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.urls]
Homepage = "https://gateco.ai"
Documentation = "https://gateco.ai/docs"
Repository = "https://github.com/fortisil/gateco-sdk-python"
"Bug Tracker" = "https://github.com/fortisil/gateco-sdk-python/issues"

[project.scripts]
gateco = "gateco_sdk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gateco_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
