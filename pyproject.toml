[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gateco"
version = "1.7.0"
description = "Official Python SDK for the Gateco API"
authors = [{name = "Rami Refaeli", email = "rami@gateco.ai"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.26",
    "pydantic>=2.5",
]

[project.optional-dependencies]
mcp = ["mcp>=1.8,<2"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "mcp>=1.8,<2",
]

[project.urls]
Homepage = "https://gateco.ai"
Documentation = "https://gateco.ai/docs"
Repository = "https://github.com/fortisil/gateco-sdk-python"
"Bug Tracker" = "https://github.com/fortisil/gateco-sdk-python/issues"

[project.scripts]
gateco = "gateco_sdk.cli:main"
gateco-mcp = "gateco_sdk.mcp:run_stdio"

[tool.hatch.build.targets.wheel]
packages = ["src/gateco_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
